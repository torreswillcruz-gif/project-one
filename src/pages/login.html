<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Northstar</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/app.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-art"><a class="brand" href="../../index.html"><span class="brand-mark">N</span>northstar<span class="brand-dot">.</span></a><div><p class="eyebrow">Welcome back</p><h1>Good work starts with a clear <em>north.</em></h1></div></section>
    <section class="auth-panel"><a class="mobile-brand brand" href="../../index.html"><span class="brand-mark">N</span>northstar<span class="brand-dot">.</span></a><div class="form-wrap"><p class="eyebrow">Account access</p><h2>Sign in</h2><p class="form-intro">Welcome back. Enter your details to continue.</p><form id="login-form"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required><label for="password">Password</label><div class="password-field"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"><button type="button" class="password-toggle" aria-label="Show password">Show</button></div><div class="form-options"><label class="checkbox-label"><input type="checkbox" name="remember"> Remember me</label><a href="#forgot">Forgot password?</a></div><button class="button submit-button" type="submit">Sign in <span>↗</span></button><p id="form-message" class="form-message" role="status"></p></form><p class="signup">New to Northstar? <a href="mailto:hello@northstar.studio?subject=Northstar%20account">Request an account</a></p></div></section>
  </main>
</body>
</html>
